<title>Media Pembelajaran Interaktif Softball — PJOK Kelas XII</title>
<style>
:root{--navy:#0b1830;--navy2:#132746;--green:#20b486;--lime:#c8f36a;--orange:#ffad5c;--paper:#f4f7fb;--ink:#14243a;--muted:#64748b;--white:#fff;--line:#dbe4ef}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--navy);color:var(--ink)}
button{font:inherit;cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 85% 8%,#24446a 0,transparent 28%),linear-gradient(145deg,#09162b,#122944 60%,#0c1e32)}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);color:white;border-bottom:1px solid #ffffff1c}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.04em}.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,var(--lime),var(--green));display:grid;place-items:center;color:#0b1830;font-weight:1000}
.topmeta{font-size:12px;color:#c5d2e2;letter-spacing:.12em;text-transform:uppercase}
.stage{width:min(1120px,calc(100% - 32px));margin:24px auto;flex:1;display:flex;align-items:center;justify-content:center}
.slide{width:100%;min-height:min(650px,calc(100vh - 190px));background:var(--paper);border-radius:24px;box-shadow:0 24px 80px #0005;overflow:hidden;display:grid;grid-template-columns:10px 1fr;animation:enter .38s ease both}
.accent{background:linear-gradient(var(--green),var(--lime),var(--orange))}
.content{padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;position:relative}
.kicker{color:#138563;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(34px,6vw,66px);line-height:1.04;letter-spacing:-.045em;color:var(--navy);margin:0 0 20px;max-width:900px}
h2{font-size:clamp(26px,4vw,42px);line-height:1.1;color:var(--navy);letter-spacing:-.03em;margin:0 0 22px}
.lead{font-size:clamp(17px,2vw,22px);line-height:1.55;color:#42536a;max-width:850px}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-top:24px}
.item{background:white;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 5px 18px #18334d0a}
.item strong{display:block;color:#0e7658;margin-bottom:7px;font-size:13px;letter-spacing:.06em}
.item p{margin:0;color:#42536a;line-height:1.5;font-size:15px;overflow-wrap:anywhere}
.bullet{padding:0;margin:16px 0 0;list-style:none;display:grid;gap:12px;max-width:900px}
.bullet li{position:relative;padding:14px 18px 14px 46px;border-radius:14px;background:#fff;border:1px solid var(--line);line-height:1.45}
.bullet li:before{content:"✓";position:absolute;left:16px;top:13px;color:#0e9b70;font-weight:900}
.hero-art{margin-top:auto;padding-top:32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:#60738b;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:#e5f7f0;color:#087553;font-weight:800;font-size:12px}
.field{height:130px;max-width:420px;width:100%;border-radius:18px;background:linear-gradient(135deg,#d8f2e6,#eff9d7);position:relative;overflow:hidden;border:1px solid #c8e9d8}
.diamond{position:absolute;width:68px;height:68px;border:3px solid #14865f;transform:rotate(45deg);left:calc(50% - 34px);top:28px;border-radius:5px}
.base{position:absolute;width:12px;height:12px;background:#ffad5c;transform:rotate(45deg)}
.b1{left:calc(50% + 29px);top:59px}.b2{left:calc(50% - 6px);top:24px}.b3{left:calc(50% - 41px);top:59px}.home{left:calc(50% - 6px);top:94px}
.controls{width:min(1120px,calc(100% - 32px));margin:0 auto 22px;display:flex;align-items:center;gap:12px;color:white}
.progress{height:5px;background:#ffffff28;border-radius:20px;flex:1;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--lime));transition:width .3s}
.counter{font-size:12px;color:#c5d2e2;min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.navbtn{border:1px solid #ffffff38;background:#ffffff12;color:white;border-radius:12px;padding:11px 16px;font-weight:750;transition:.2s}
.navbtn:hover{background:#ffffff25;transform:translateY(-1px)}.navbtn.primary{background:var(--green);border-color:var(--green);color:#06291f}.navbtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.menu-btn{border:0;background:transparent;color:white;font-size:20px;padding:8px}
.drawer{position:fixed;inset:0;background:#06101dcc;z-index:10;display:none;align-items:stretch;justify-content:flex-end}.drawer.open{display:flex}.drawer-panel{width:min(380px,92vw);background:#f7fafc;padding:24px;overflow:auto;animation:slidein .25s ease}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.drawer h3{margin:0;color:var(--navy)}.close{border:0;background:#e7edf4;border-radius:9px;padding:8px 12px}.toc{display:grid;gap:8px}.toc button{text-align:left;border:1px solid var(--line);background:white;padding:12px;border-radius:10px;color:#20344c}.toc button.active{border-color:var(--green);background:#e8f8f1;font-weight:800}
.quiz{margin-top:18px}.question{font-size:clamp(19px,2.5vw,25px);line-height:1.4;font-weight:800;color:#172c46;margin:12px 0 20px}.choices{display:grid;gap:10px}.choice{border:1.5px solid #d7e1ec;background:white;border-radius:13px;padding:14px 16px;text-align:left;display:flex;gap:12px;align-items:center;color:#20344c;transition:.15s}.choice:hover{border-color:#20b486;background:#f2fbf7}.choice.selected{border-color:#0e9b70;background:#e5f7f0;box-shadow:0 0 0 2px #20b48620}.choice .letter{width:28px;height:28px;border-radius:9px;background:#edf2f7;display:grid;place-items:center;font-weight:900;color:#38506a;flex:none}.quiz-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.check{border:0;background:var(--navy2);color:white;border-radius:12px;padding:12px 18px;font-weight:800}.feedback{margin-top:16px;padding:16px 18px;border-radius:14px;background:#e8f8f1;border:1px solid #bce8d4;line-height:1.5;display:none}.feedback.show{display:block;animation:enter .25s ease}.feedback.wrong{background:#fff4e8;border-color:#f6d2aa}.small{font-size:13px;color:#6b7d91;margin-top:12px}
.footer{text-align:center;color:#aebed0;font-size:11px;padding:0 16px 18px}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes slidein{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
@media(max-width:620px){.topbar{height:58px}.topmeta{display:none}.stage{margin:14px auto}.slide{min-height:calc(100vh - 160px);border-radius:18px}.content{padding:25px 20px}.controls{gap:7px}.navbtn{padding:10px 12px}.counter{min-width:55px}.footer{display:none}}
@media print{body,.app{background:white}.topbar,.controls,.footer,.menu-btn{display:none!important}.stage{width:100%;margin:0}.slide{box-shadow:none;min-height:100vh;page-break-after:always}}
</style>

<script>
const DATA = {"slides": [{"number": 1, "lines": ["MEDIA PEMBELAJARAN INTERAKTIF", "PERMAINAN", "SOFTBALL", "PJOK • KELAS XII SMA", "Kenali teknik, pahami strategi, mainkan dengan sportif.", "MULAI BELAJAR  →", "Klik tombol mulai untuk masuk ke menu materi."]}, {"number": 2, "lines": ["NAVIGASI", "Pilih perjalanan belajarmu", "Gunakan tombol untuk menuju bagian yang ingin dipelajari.", "01", "Pengenalan", "Pengertian, sejarah, tujuan", "BUKA  →", "02", "Peralatan & lapangan", "Bagian lapangan dan perlengkapan", "BUKA  →", "03", "Teknik dasar", "Melempar, menangkap, memukul, berlari", "BUKA  →", "04", "Aturan permainan", "Pemain, inning, run, out", "BUKA  →", "05", "Strategi bermain", "Menyerang dan bertahan", "BUKA  →", "06", "Kuis interaktif", "Uji pemahamanmu", "BUKA  →"]}, {"number": 3, "lines": ["01 • PENGENALAN", "Tujuan pembelajaran", "Setelah mengikuti pembelajaran, siswa diharapkan mampu:", "01", "Menjelaskan", "pengertian, sejarah, dan tujuan permainan softball.", "02", "Mengidentifikasi", "sarana, prasarana, posisi, dan aturan dasar.", "03", "Mempraktikkan", "gerak dasar melempar, menangkap, memukul, dan berlari.", "04", "Menerapkan", "strategi sederhana serta nilai kerja sama dan sportivitas.", "KEMBALI KE MENU"]}, {"number": 4, "lines": ["01 • PENGENALAN", "Apa itu softball?", "Permainan bola kecil beregu dengan dua tim yang bergantian menyerang dan bertahan.", "REGU PEMUKUL", "Memukul bola yang dilempar pitcher, lalu berlari melewati base untuk mencetak angka.", "REGU PENJAGA", "Menangkap dan menguasai bola, lalu berusaha mematikan pemukul atau pelari lawan.", "TUJUAN UTAMA", "Mencetak run sebanyak mungkin dan mencegah lawan mencetak run.", "MENU"]}, {"number": 5, "lines": ["01 • PENGENALAN", "Sejarah singkat", "Softball mulai berkembang di Amerika Serikat pada akhir abad ke-19.", "1887", "Chicago, Amerika Serikat", "George Hancock mengembangkan permainan yang kemudian dikenal sebagai softball. Permainan ini awalnya dimainkan di dalam ruangan, lalu berkembang ke lapangan terbuka dan menyebar ke berbagai negara.", "Ingat: softball dan baseball memiliki hubungan sejarah, tetapi berbeda dalam ukuran bola, lapangan, dan sejumlah aturan.", "MENU"]}, {"number": 6, "lines": ["02 • PERALATAN & LAPANGAN", "Mengenal lapangan softball", "Lapangan memiliki area infield dan outfield serta empat titik base.", "2ND", "1ST", "HOME", "3RD", "P", "INFIELD", "Area bagian dalam yang mencakup home plate, tiga base, dan area pitcher.", "OUTFIELD", "Area lapangan luar yang dijaga oleh left, center, dan right fielder.", "Pada fastpitch dewasa standar, jarak antarbase sekitar 18,29 meter. Ukuran dapat berbeda menurut kategori dan peraturan."]}, {"number": 7, "lines": ["02 • PERALATAN & LAPANGAN", "Peralatan utama", "Kenali fungsi setiap perlengkapan sebelum praktik.", "BOLA", "Objek yang dilempar, dipukul, dan ditangkap.", "BAT", "Alat untuk memukul bola.", "GLOVE", "Sarung tangan untuk membantu menangkap bola.", "HELMET", "Melindungi kepala pemukul dan pelari.", "BASE", "Titik yang harus disentuh pelari secara berurutan.", "PERLENGKAPAN CATCHER", "Masker dan pelindung tubuh untuk penangkap.", "MENU"]}, {"number": 8, "lines": ["04 • ATURAN PERMAINAN", "Posisi pemain bertahan", "Dalam fastpitch standar, satu regu menempatkan sembilan pemain di lapangan.", "1", "Pitcher", "Melempar bola", "2", "Catcher", "Menerima lemparan", "3", "First baseman", "Menjaga base 1", "4", "Second baseman", "Menjaga area base 2", "5", "Third baseman", "Menjaga base 3", "6", "Shortstop", "Menjaga area antara base 2–3", "7", "Left fielder", "Menjaga outfield kiri", "8", "Center fielder", "Menjaga outfield tengah", "9", "Right fielder", "Menjaga outfield kanan", "MENU"]}, {"number": 9, "lines": ["03 • TEKNIK DASAR", "Teknik melempar (throwing)", "Lemparan yang akurat membantu tim menguasai bola dan mematikan pelari.", "LEMPARAN ATAS", "Pegang bola, tarik lengan ke belakang atas, langkahkan kaki berlawanan, putar badan, lalu lepaskan bola ke sasaran.", "LEMPARAN SAMPING", "Ayunkan lengan dari samping tubuh. Arahkan bahu dan pandangan ke sasaran serta jaga keseimbangan.", "LEMPARAN BAWAH", "Ayunkan lengan dari bawah dan lepaskan bola dengan gerak terkontrol untuk operan jarak dekat.", "Kunci gerak: posisi tubuh seimbang • pandangan ke sasaran • gerak lanjutan terkontrol.", "MENU"]}, {"number": 10, "lines": ["03 • TEKNIK DASAR", "Teknik menangkap (catching)", "Ikuti arah bola, posisikan tubuh, dan serap bola dengan glove.", "FLY BALL", "Bola melambung di udara. Bergerak ke bawah lintasan bola dan tangkap setinggi yang nyaman.", "LINE DRIVE", "Bola melaju relatif lurus dan cepat. Siapkan glove dan tubuh di jalur bola.", "GROUND BALL", "Bola bergulir atau memantul. Rendahkan posisi tubuh, buka glove dekat permukaan tanah.", "Tips: gunakan dua tangan bila memungkinkan, tetap fokus pada bola, dan jangan menutup mata saat menangkap."]}, {"number": 11, "lines": ["03 • TEKNIK DASAR", "Teknik memukul (batting)", "Pukulan yang baik mengarahkan bola ke area yang sulit dijangkau penjaga.", "1 • SIKAP AWAL", "Berdiri menyamping, kaki terbuka nyaman, lutut rileks, dan pegang bat dengan kedua tangan.", "2 • AYUNAN", "Amati bola, putar pinggul dan bahu, lalu ayunkan bat melalui jalur bola.", "3 • GERAK LANJUTAN", "Lanjutkan ayunan, jaga keseimbangan, letakkan bat dengan aman, lalu lari ke base pertama.", "Keselamatan: ayunkan bat hanya di area latihan yang ditentukan dan pastikan tidak ada orang di dekat lintasan ayunan.", "MENU"]}, {"number": 12, "lines": ["03 • TEKNIK DASAR", "Pitcher dan catcher", "Keduanya bekerja sama memulai dan mengendalikan permainan.", "PITCHER", "Pemain bertahan yang melempar bola ke arah batter. Dalam fastpitch, lemparan dilakukan dengan gerakan underhand sesuai aturan.", "CATCHER", "Berada di belakang home plate. Menerima lemparan, menghentikan bola yang lepas, mengamati pelari, dan berkomunikasi dengan tim.", "Keduanya perlu komunikasi, konsentrasi, dan pemahaman situasi permainan.", "MENU"]}, {"number": 13, "lines": ["03 • TEKNIK DASAR", "Base running dan sliding", "Pelari harus membaca situasi, menyentuh base sesuai urutan, dan mengambil keputusan tepat.", "BASE RUNNING", "Setelah memukul, berlari menuju base pertama. Perhatikan bola, penjaga, dan instruksi pelatih base. Jangan melewati base tanpa memperhatikan situasi.", "SLIDING", "Gerakan meluncur menuju base untuk mencapai base atau menghindari tag. Latih bertahap di permukaan aman dan di bawah pengawasan guru.", "Di sekolah, utamakan keselamatan. Sliding bukan keharusan jika fasilitas atau permukaan lapangan tidak aman."]}, {"number": 14, "lines": ["04 • ATURAN PERMAINAN", "Bagaimana permainan berlangsung?", "Ringkasan aturan fastpitch standar; kompetisi atau kategori usia dapat memiliki ketentuan khusus.", "7 INNING", "Umumnya tujuh inning. Setiap tim mendapat giliran menyerang dan bertahan.", "3 OUT", "Giliran menyerang berakhir setelah tiga pemain dinyatakan out.", "4 BALL", "Empat ball memberi batter hak menuju base pertama.", "3 STRIKE", "Tiga strike menyebabkan batter strikeout, dengan ketentuan khusus foul ball."]}, {"number": 15, "lines": ["04 • ATURAN PERMAINAN", "Run, safe, dan out", "Pahami cara mencetak angka dan cara regu bertahan menghentikan serangan.", "RUN / ANGKA", "Pelari memperoleh satu run ketika berhasil menyentuh base 1, 2, 3, lalu kembali ke home plate secara sah.", "SAFE", "Pelari berhasil mencapai base dengan sah sebelum dimatikan oleh regu bertahan.", "OUT", "Pemain dinyatakan mati, misalnya strikeout, fly out, force out, atau tag out sesuai aturan.", "Contoh: bola hasil pukulan ditangkap langsung sebelum menyentuh tanah → batter out (fly out).", "MENU"]}, {"number": 16, "lines": ["05 • STRATEGI BERMAIN", "Strategi menyerang dan bertahan", "Strategi dipilih berdasarkan situasi, kemampuan pemain, dan posisi pelari.", "MENYERANG (OFFENSE)", "• Memukul ke ruang kosong", "• Membaca arah bola", "• Berlari antarbase dengan cermat", "• Bunting atau stealing jika sesuai aturan dan situasi", "BERTAHA function classify(lines){

    } else {
      const lead = clean.find(x=>x.length>55 && !/^A\./.test(x));
